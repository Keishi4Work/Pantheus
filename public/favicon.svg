<svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Standalone asset: the stroke can't be currentColor, so it carries both ink
       values from globals.css and switches on the browser chrome's theme. -->

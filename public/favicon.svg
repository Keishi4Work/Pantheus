    path { stroke: #1E1E1E }
    @media (prefers-color-scheme: dark) { path { stroke: #ECECEA } }
  </style>
  <path d="M7 3.5 17.5 20.5M11.9 11.4 6 20.5" stroke-width="2.6"/>
</svg>
